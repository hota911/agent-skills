schema_version: "1.1"
name: feature-proposal-two-audiences
expected_outcome: |
  依頼に読者が書かれていないことが扱われている。依頼者に読者を問うか、想定した読者を仮定として
  明示するかのどちらかがあり、読者を黙って決め打ちしていない。読者を複数置いた場合は、それぞれに
  してほしいこと（指摘・承認）が冒頭で書き分けられ、共有メッセージも宛先ごとに見てほしい箇所を
  示している。
  実測の数字（12,000件、7割、クリック率 4%、オペレーター18人）と、未検証の項目（案B の時間半減、
  3週間の改修見積もり、法務への相談、予算、評価方法）が区別して書かれている。案A・B・C は表で
  並べられ、迷っている点が冒頭に出ている。本文は5分で読み終わる長さに収まっている。
